<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="header.css" />
    <title>Header Page</title>
  </head>
  <body>
    <div class="container-fluid main d-none d-lg-block">
      <div class="container text-white d-flex justify-content-between">
        <div class="d-flex align-items-center py-2 main-1">
          <i class="fa fa-envelope pe-2" aria-hidden="true"></i>
          <a class="pe-5 text-decoration-none">Support@example.com</a>
          <i class="fa fa-globe pe-2" aria-hidden="true"></i>
          <a class="text-decoration-none" href="#"
            >735 Russell Street Lowell, MA 01852</a
          >
        </div>
        <div class="d-flex align-items-center">
          <i class="fa fa-facebook pe-3" aria-hidden="true"></i>
          <i class="fa fa-twitter pe-3" aria-hidden="true"></i>
          <i class="fa fa-instagram pe-3" aria-hidden="true"></i>
          <i class="fa fa-google-plus pe-3" aria-hidden="true"></i>
        </div>
      </div>
    </div>
    <div class="container-fluid bg-white header" id="myHeader">
      <nav
        class="navbar navbar-expand-lg navbar-white bg-white offset-lg-0 " 
      >
        <a class="navbar-brand" href="#">
          <img src="./images/logo-dark.png" class="logo" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="px-3 nav-link" href="#">Home</a>
            </li>
            <li class="nav-item active">
              <a class="px-3 nav-link" href="#"
                >Services <span class="sr-only"></span
              ></a>
            </li>
            <li class="nav-item">
              <a class="px-3 nav-link" href="#">Pricing</a>
            </li>
            <li class="nav-item">
              <a class="px-3 nav-link" href="#">Team</a>
            </li>
            <li class="nav-item">
              <a class="px-3 nav-link" href="#">Contact</a>
            </li>
            <li class="nav-item">
              <a class="px-3 nav-link" href="#">Log In</a>
            </li>
            <li class="nav-item singup-btn">
              <a class="px-3 nav-link" href="#">Sing Up</a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
    <script>
      window.onscroll = function() {myFunction()};
      
      var header = document.getElementById("myHeader");
      var sticky = header.offsetTop;
      
      function myFunction() {
        if (window.pageYOffset > sticky) {
          header.classList.add("sticky");
        } else {
          header.classList.remove("sticky");
        }
      }
      </script>
  </body>
</html>
